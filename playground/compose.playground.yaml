# The hosted playground.
#
# Every option below is load-bearing. This service compiles and executes
# code written by strangers, and the API's own limits — submission size,
# stage timeouts, a run timeout, a concurrency cap — bound how much work one
# visitor can ask for. They do not bound what a program can *do* once it
# runs. That is what the runtime settings here are for, and running this
# image without them means running arbitrary code with the daemon's default
# permissions.

services:
  playground:
    build:
      context: ..
      dockerfile: playground/Containerfile
    ports:
      # Loopback only by default. Put a TLS-terminating reverse proxy in
      # front rather than publishing this straight onto an interface.
      - "127.0.0.1:8080:8080"

    # No network. A submitted program cannot call out, cannot be called, and
    # cannot reach anything else in the compose project. The published port
    # above still reaches the API, which is the one path in.
    network_mode: none

    # The image is immutable at runtime. Everything a build writes goes to
    # the tmpfs below, which is capped, wiped between restarts, and mounted
    # noexec/nosuid — except the scratch directory, which cannot be noexec
    # because running the compiled program is the point.
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m,mode=1777,nosuid,nodev
      - /home/playground:rw,size=16m,mode=0700,nosuid,nodev,noexec

    # A compiled program is a fresh process from an unprivileged user: it
    # needs no capabilities at all, and cannot acquire any.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Fork bombs and runaway allocation are bounded here rather than by the
    # program's good behaviour.
    pids_limit: 256
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.0"
    ulimits:
      nproc: 128
      fsize: 268435456
      core: 0

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
